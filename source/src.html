<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringside Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.head h2,.panel h3,.kv b,.kv span,.tile b{overflow-wrap:anywhere;min-width:0}.tile{min-width:0}
/* VOICE: fight-night poster meets an owner's ledger; loud headers, calm working rows
   IDEA: the printed match card handed out at the arena door
   PICTURE: the booking card itself, compact rows with clickable names and finish tags
   COLOUR and TYPE: ring-rope red dominant, canvas white panels, electric blue for winners; Anton + Archivo
   LAYOUT: red header band with date, money and countdown, tab row, one working screen per tab */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ee,#151214);--panel:light-dark(#ffffff,#221d20);--ink:light-dark(#18141a,#f2eef0);
--mute:light-dark(#6a6168,#a99fa6);--line:light-dark(#e2dcdf,#3a3236);--red:#c8102e;--red2:light-dark(#9e0b23,#ff5a72);
--blue:light-dark(#1546d1,#6f9bff);--bluebg:light-dark(#e6edff,#1b2850);--heel:light-dark(#8a1222,#ff7a8c);--face:light-dark(#0f6a33,#6fdc9c);
--gold:light-dark(#7a5600,#ffd56b);--goldbg:light-dark(#fff0c2,#3d3215);--greenbg:light-dark(#e3f4ea,#173326)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.05;letter-spacing:.01em;margin:0}
.top{background:var(--red);color:#fff;padding:16px max(4vw,16px) 0}
.top .row{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:end;justify-content:space-between;max-width:1240px;margin:auto}
.top h1{font-size:clamp(28px,4.4vw,44px)}
.top small{display:block;font-size:14px;opacity:.85}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat b{display:block;font:21px Anton,sans-serif;white-space:nowrap}.stat span{font-size:13px;opacity:.85}
.count{background:#fff;color:var(--red);border-radius:10px;padding:8px 14px;font-weight:800;font-size:15px}
.count b{font:22px Anton,sans-serif;margin-right:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1240px;margin:14px auto 0;padding-bottom:14px}
.ng{position:relative}
.nb{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;background:#ffffff1f;border:2px solid #ffffff59;border-radius:12px;padding:10px 18px;min-height:50px;font:800 17px Archivo,sans-serif;letter-spacing:.01em;cursor:pointer}
.nb:hover{background:#ffffff33}
.nb.on{background:#fff;color:var(--red);border-color:#fff}
.nb .car{font-size:12px;transition:transform .15s}.ng.open .car{transform:rotate(180deg)}
.dd{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:230px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #0006;overflow:hidden}
.ng.open .dd{display:block}
.dd a{display:block;padding:12px 16px;min-height:48px;color:var(--ink);text-decoration:none;font-weight:700;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.dd a:last-child{border-bottom:0}.dd a:hover{background:var(--bluebg);color:var(--blue)}
.dd a.on{border-left-color:var(--red);background:light-dark(#fbe9ec,#3b1c23)}
.dd a small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
@media(max-width:600px){.nb{padding:8px 14px;font-size:16px}.ng:last-child .dd{left:auto;right:0}}
.chipf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chipf button{min-height:38px;padding:5px 13px}
.chipf button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.sheet .kv{border-bottom:1px solid var(--line);padding:7px 0;align-items:center}
.sheet .kv b{white-space:normal;text-align:right}
.trait{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bluebg);color:var(--blue);margin:2px 4px 2px 0}
.actbar{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.actbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actbar .grp>span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);width:84px}
@media(max-width:600px){.actbar .grp>span{width:100%}}
button.ab{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
button.ag{background:var(--greenbg);border-color:var(--face);color:var(--face)}
button.ar{background:var(--red);border-color:var(--red);color:#fff}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin:8px 0 22px}
.fcard{border:1px solid var(--line);border-left:5px solid var(--hc,var(--line));border-radius:12px;padding:12px 14px;background:var(--panel);display:grid;gap:6px;align-content:start}
.fcard .ft{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fcard .fr{font-weight:800;color:var(--hc)}
.fcard .fh{font:24px Anton,sans-serif;color:var(--hc);white-space:nowrap}
.fcard .fh small{font:600 12px Archivo,sans-serif;margin-left:4px}
.fcard .fn{font-weight:700;font-size:17px}
.fcard .fn button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.fcard .fn button:focus-visible{outline:3px solid var(--blue)}
.fsec{display:flex;align-items:baseline;gap:10px;margin-top:6px}.fsec h3{font-size:22px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:1240px;margin:auto;padding:22px max(4vw,16px) 48px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
.head h2{font-size:clamp(26px,3.6vw,38px)}.head p{margin:2px 0 0;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.grid.side{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
@media(max-width:900px){.grid,.grid2,.grid.side{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:23px;margin-bottom:8px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;min-height:44px;cursor:pointer}
button.go{background:var(--red);border-color:var(--red);color:#fff}
button.bl{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.sm{min-height:36px;padding:4px 11px;font-size:14px}
.match{display:grid;grid-template-columns:26px 66px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.match:first-child{border-top:0}
.no{font:15px Anton,sans-serif;color:var(--mute);text-align:right}
.main .no{color:var(--red2)}
.kind{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;text-align:center;background:var(--line);white-space:nowrap}
.kind.m{background:var(--red);color:#fff}.kind.s{background:var(--goldbg);color:var(--gold)}.kind.a{background:var(--greenbg);color:var(--face)}
.vs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.vs i{font-size:13px;color:var(--mute);font-style:normal}
.w{font:inherit;font-weight:600;padding:4px 8px;min-height:36px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink)}
.w:hover{border-color:var(--line)}
.side{display:inline-flex;flex-wrap:wrap;border-radius:9px;border:1px solid transparent}
.side.win{border-color:var(--blue);background:var(--bluebg)}
.side.win .w{color:var(--blue)}
.side.win::after{content:"✓";color:var(--blue);font-weight:800;padding:6px 8px 0 0}
.w small{font-weight:400;color:var(--mute);font-size:12px;margin-left:3px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bluebg);color:var(--blue);white-space:nowrap}
.tag.ns{background:light-dark(#f4e3e6,#3b1c23);color:var(--red2)}
.tag.sim{background:none;color:var(--mute);font-weight:600}
.tag.mo{background:var(--greenbg);color:var(--face)}
.ctl{display:flex;gap:4px}
.ctl button{min-width:36px;padding:4px 8px}
.seg{color:var(--mute);font-size:15px}.seg b{color:var(--ink)}
@media(max-width:640px){.match{grid-template-columns:22px minmax(0,1fr);row-gap:4px}.match .kind{display:none}.match .tag,.match .ctl{grid-column:2}}
.hint{font-size:14px;color:var(--mute);margin:10px 0 0}
.empty{padding:26px 8px;text-align:center;color:var(--mute)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--red)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}.kv b{white-space:nowrap;font-variant-numeric:tabular-nums}
.kv.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.pos{color:var(--face)}.neg{color:var(--red2)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.al{font-size:13px;font-weight:700}.al.F{color:var(--face)}.al.H{color:var(--heel)}.al.T{color:var(--gold)}
.bar{display:inline-block;width:46px;height:7px;border-radius:99px;background:var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.hot{color:var(--red2);font-weight:800;font-size:13px}.cold{color:var(--blue);font-weight:800;font-size:13px}
.warn{color:var(--red2);font-weight:700}
.sub{font-size:13px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{font:16px Anton,sans-serif;white-space:nowrap}
.k{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;margin-right:6px;background:var(--line)}
.k.me{background:var(--red);color:#fff}.k.co{background:var(--bluebg);color:var(--blue)}.k.db{background:var(--greenbg);color:var(--face)}.k.of{background:var(--goldbg);color:var(--gold)}.k.mt{background:var(--red);color:#fff}.k.sg{background:var(--greenbg);color:var(--face)}.k.ms{background:var(--goldbg);color:var(--gold)}.k.aw{background:var(--gold);color:#fff}.k.tt{background:var(--gold);color:#fff}.k.rt{background:var(--line)}
.hrow summary{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;list-style:none}.hrow summary::-webkit-details-marker{display:none}.hrow[open] summary{background:var(--bluebg)}.hrow .hd{padding:8px 4px 14px 14px;font-size:14px}.hrow .hd div{padding:3px 0}
@media(max-width:600px){.hrow summary{grid-template-columns:1fr auto}.hrow summary time{grid-column:1/-1;font-size:13px;color:var(--mute)}}
nav a.menu{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:minmax(0,1fr);gap:0}}
label{display:block;font-size:14px;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:4px;font:16px Archivo,sans-serif;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
input[type=range]{padding:0;border:0;background:none}
input[type=checkbox],input[type=radio]{display:inline-block;width:20px;min-height:20px;height:20px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--red)}
td,th{overflow-wrap:anywhere}
@media(max-width:760px){
 table.stack thead{display:none}
 table.stack tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
 table.stack td{border:0;padding:2px 0;text-align:left}
 table.stack td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute)}
 table.stack td:first-child,table.stack td:last-child{grid-column:1/-1}
 table.stack td:first-child::before,table.stack td:last-child::before{display:none}
 table.stack td:empty{display:none}
 table.stack td[colspan]{grid-column:1/-1}
}
.list{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;font-weight:500;min-height:40px}
.list button.sel{background:var(--bluebg);color:var(--blue)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{border:0;border-radius:0;min-height:40px}
.seg2 button.on{background:var(--ink);color:var(--bg)}
dialog{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:90vh;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0007}
dialog::backdrop{background:#000a}
dialog.wide{width:min(980px,96vw)}
.wl-img{image-rendering:pixelated;display:block}
.hd{display:inline-block;vertical-align:middle;width:26px;height:28px;border-radius:7px;overflow:hidden;background:var(--bluebg);margin-right:8px;flex:none}
.hd img{width:100%;height:100%}
.pport{float:left;margin:0 16px 6px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bluebg)}
.pport img{display:block;width:96px;height:auto}
.lk{display:grid;grid-template-columns:minmax(170px,230px) 1fr;gap:18px;align-items:start}
.lk .pv{position:sticky;top:0;display:grid;gap:10px;justify-items:center}
.lk .pv canvas{width:100%;max-width:216px;height:auto;image-rendering:pixelated;border-radius:14px;border:1px solid var(--line)}
.lk .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lk .tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lk .row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lk .row>span{font-weight:700;font-size:14px}
.lk .step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;min-width:0}
.lk .step b{font-size:14px;overflow-wrap:anywhere}.lk .step small{display:block;color:var(--mute);font-size:11px;font-weight:600}
.lk .step button{padding:0;min-width:44px}
.lk .sw{width:44px;height:44px;padding:0;border-radius:10px;background:var(--c);border:2px solid var(--line)}
.lk .sw.sel{outline:3px solid var(--blue);outline-offset:1px}
.lk .pal{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.lk .pal .sw{width:34px;height:34px;min-height:34px}
.lk .gal{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;padding:6px 0}
.lk .gal button{padding:4px;min-height:0;display:grid;justify-items:center;gap:2px;font-size:11px}
.lk .gal button.sel{border-color:var(--blue);background:var(--bluebg)}
.lk .gal img{width:48px;height:auto;image-rendering:pixelated}
@media (max-width:700px){.lk{grid-template-columns:1fr}.lk .pv{position:static}.lk .pv canvas{max-width:180px}.lk .row{grid-template-columns:90px 1fr auto}}

.dh{background:var(--red);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:1}.dh h3{font-size:26px}.dh div{font-size:14px;opacity:.9}
.dh.b{background:var(--blue)}
.db{padding:16px 20px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chips button{min-height:38px;padding:5px 11px;font-weight:500}
.chips button.sel{border-color:var(--blue);background:var(--bluebg);color:var(--blue);font-weight:700}
.chips button small{color:var(--mute);margin-left:4px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin:8px 0 12px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:8px;min-height:48px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot.on{border-color:var(--blue)}
.res{border-top:1px solid var(--line);padding:9px 0}
.res:first-child{border-top:0}
.res .st{float:right;font-weight:800;color:var(--gold);white-space:nowrap;margin-left:10px}
.res p{margin:3px 0 0;color:var(--mute);font-size:14px}
.big{font:clamp(34px,6vw,52px) Anton,sans-serif;color:var(--gold)}
.msg{padding:10px 12px;border-radius:10px;background:var(--bluebg);color:var(--blue);font-weight:600;margin-top:10px}
.msg.bad{background:light-dark(#f4e3e6,#3b1c23);color:var(--red2)}
.cos{display:grid;gap:6px;margin:8px 0}
.cos label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:500}
.title{background:#141016;color:#f4eef0;border-radius:18px;padding:clamp(14px,3vw,26px);margin-bottom:20px;display:grid;gap:14px;justify-items:center;overflow:hidden}
.plate{background:linear-gradient(#f6d26b,#d9a520);color:#231612;border:4px solid #231612;box-shadow:0 0 0 4px #f6d26b,0 8px 0 #000;border-radius:16px;padding:10px clamp(18px,4vw,40px);text-align:center;max-width:100%}
.plate h2{font-size:clamp(34px,7vw,64px);letter-spacing:.06em;line-height:1}.plate small{display:block;font-weight:800;letter-spacing:.25em;font-size:clamp(9px,1.6vw,12px);text-transform:uppercase;margin-top:4px}
#arena{width:100%;max-width:820px;height:auto;image-rendering:pixelated;border-radius:12px;display:block}
.hm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 20px;min-height:64px;border-radius:14px;border:0;box-shadow:0 5px 0 #0004;margin-bottom:12px;background:var(--panel);color:var(--ink);outline:1px solid var(--line)}
.mbtn b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(22px,3vw,28px);letter-spacing:.06em;text-transform:uppercase}.mbtn span{font-weight:500;font-size:14px;opacity:.85;text-align:right}
.mbtn.red{background:var(--red);color:#fff;outline:0}.mbtn.gold{background:#f2c230;color:#231612;outline:0}
.mbtn:disabled{opacity:.45;cursor:not-allowed}.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.slot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--panel)}
.slot.vacant{border-style:dashed;opacity:.85}.slot.vacant .badge{font-size:26px}
.badge{flex:none;width:54px;height:54px;border-radius:10px;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:15px;letter-spacing:.04em;color:#fff;background:var(--c,var(--red));overflow:hidden;text-align:center;line-height:1}
.badge img{width:100%;height:100%;object-fit:cover}
.slot .sl{flex:1 1 160px;min-width:0}.slot .sl b{display:block;overflow-wrap:anywhere}
.steph{font-family:Anton,Impact,sans-serif;font-size:clamp(20px,3vw,26px);letter-spacing:.04em;text-transform:uppercase;margin:22px 0 10px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:grid;align-content:start}
.scard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.scard.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}

      const side=(s,si)=>`<span class="side${x.win===si?' win':''}">${s.map(id=>`<button class="w" data-win="${i}:${si}">${holds(W(id)).length?'<span title="Champion">🏆</span> ':''}${esc(W(id).name)}<small>${pd(W(id))}</small></button>`).join('<i style="align-self:center">&amp;</i>')}</span>`;
      const fh=mHeat(x.sides);return `<div class="match${i===lastM?' main':''}"><div class="no">${i+1}</div><span class="kind m">${x.tour?'Bracket':i===lastM?'Main':x.sides.length>2?x.sides.length+'-way':x.sides[0].length>1?'Tag':'Match'}</span><div class="vs">${x.sides.map((sd,si)=>side(sd,si)).join('<i>vs</i>')}<button class="sm" data-gmk="${i}" title="Match type" style="min-height:30px;padding:2px 8px;font-size:12px">${gimOf(x).k?esc(gimOf(x).name):'Standard'}${gimOf(x).cost?` · ${money(gimOf(x).cost)}`:''}</button>${fh?`<span class="sub" style="color:${heatCol(fh)};font-weight:700" title="Feud heat">🔥 ${Math.round(fh)}</span>`:''}</div>${tagT}${ctl}</div>`}
    if(x.t==='s')return `<div class="match"><div class="no">${i+1}</div><span class="kind s">Segment</span><div class="seg">${esc(x.g)}: ${x.who.map(id=>`<b>${esc(W(id).name)}</b>`).join(' and ')}${x.oc?` <span class="tag">${esc((segOuts(x.g,x.who).find(o=>o[0]===x.oc)||['',''])[1])}</span>`:''}</div><span class="tag sim">Charisma</span>${ctl}</div>`;
    return `<div class="match"><div class="no">${i+1}</div><span class="kind a">Ad</span><div class="seg">Sponsor break</div><span class="tag mo">+${money(adPay(m))}</span>${ctl}</div>`;
  };
  const r=roster(G.me);
  $('#app').innerHTML=`<div class="head"><div><h2>${major?esc(m.majorName)+' (Major Event)':esc(wkName(m))+', '+fmtDate(G.date)}</h2><p>Click a name to set a clean winner. Use Finish for anything special. The last match is the main event.</p></div>
  ${wevB}<div class="btns"><button id="addm" ${r.length<2?'disabled':''}>Add match</button><button id="adds" ${r.length?'':'disabled'}>Add segment</button><button id="adda">Add ad</button><button id="auto" ${r.length<2?'disabled':''}>Auto-fill</button>${G.tour?(G.card.some(x=>x.tour)?'':`<button id="tround" class="bl">Add ${esc(G.tour.name)} ${tourLabel(G.tour.alive.length).toLowerCase()}</button>`):`<button id="tnew">Tournament</button>`}<button id="skip" title="No show this week">Skip week</button><button class="go" id="run">Run the show</button></div></div>
  <div class="grid"><div class="panel">${card.length?card.map(row).join(''):`<div class="empty">${r.length<2?'You need at least 2 wrestlers. Sign free agents on the Roster screen.':'The card is empty. Add matches and segments, or use Auto-fill.'}</div>`}</div>
  <aside class="panel">${(()=>{const L=G.war||[],x=L[L.length-1];if(!x)return '';const mine=x.rows.find(r=>r.c===G.me);return `<div class="kv" style="margin-bottom:10px"><span>Last week's ratings war</span><b>${mine?`${ord(mine.rk)} of ${x.rows.length}`:'Sat out'}</b></div>`})()}${feudCards()?`<h3>Your feuds</h3><p class="sub" style="margin:0">Click a feud to add it to the card. Staleness counts their matches in the last 6 weeks; too many cools the feud.</p>${feudCards()}`:''}<h3>Show outlook</h3>
  <div class="kv"><span>Expected crowd</span><b>${crowd.toLocaleString('en-US')}</b></div>
  <div class="kv"><span>Ticket sales <small class="sub">(${crowd.toLocaleString('en-US')} at $${price(major,m).toFixed(2)}, set by popularity)</small></span><b>${money(gate)}</b></div>
  <div class="kv"><span>Sponsor ads</span><b>${money(ads)}</b></div><div class="kv"><span>TV viewers <small class="sub">(about ${viewersFor(m,3,major).toLocaleString('en-US')} at 3 stars)</small></span><b>${money(tvx)}</b></div>${major?`<div class="kv"><span>Event buys <small class="sub">(about ${buysFor(m,3).toLocaleString('en-US')})</small></span><b>${money(bx)}</b></div>`:''}
  <div class="kv"><span>Wages (${r.length} wrestlers)</span><b>-${money(wages)}</b></div>
  <div class="kv"><span>Show costs</span><b>-${money(cost)}</b></div>${gcost?`<div class="kv"><span>Match gimmicks</span><b>-${money(gcost)}</b></div>`:''}
  <div class="kv tot"><span>Expected profit</span><b class="${pr<0?'neg':'pos'}">${money(pr)}</b></div>
  <div class="kv" style="margin-top:12px"><span>Hype for ${esc(m.majorName)}</span><b>${Math.round(m.hype)} / 100</b></div><div class="meter"><i style="width:${m.hype}%"></i></div>
  <div class="kv"><span>Last show</span><b>${m.lastRating!=null?stars(m.lastRating):'None yet'}</b></div>
  <p class="hint">The show's rating combines every match and segment. The main event counts 3 times, the opener 1.5 times and title matches 1.5 extra, and everyone on the card gains or loses a little popularity from it. Every match and segment rated 3 stars or more earns a crowd buzz bonus, and great ones can raise Workrate or Charisma by 1. Good shows also raise company popularity, which grows future crowds and sponsor pay. Weekly Shows build hype for the Major Event, where the big money is.</p></aside></div>`;
}
document.addEventListener('click',e=>{
  if(tab!=='book'||!G)return;const t=e.target.closest('button');if(!t||!$('#app').contains(t))return;const d=t.dataset,card=G.card;
  if(d.win){const[i,s]=d.win.split(':').map(Number);const x=card[i];x.win=x.win===s&&!x.fin?null:s;x.fin=null;rerender()}
  else if(d.up){const i=+d.up;[card[i-1],card[i]]=[card[i],card[i-1]];rerender()}
  else if(d.dn){const i=+d.dn;[card[i+1],card[i]]=[card[i],card[i+1]];rerender()}
  else if(d.rm){card.splice(+d.rm,1);rerender()}
  else if(d.fin)dFinish(+d.fin);
  else if(d.fm){const f=FE().find(x=>x.id===d.fm),x=feudMatch(f),u=used();if(x.sides.flat().some(id=>u.has(id))){alert('One of them is already in a match on this card.');return}card.push(x);rerender()}
  else if(d.gmk)dGim(+d.gmk);
  else if(d.bo){const x=card[+d.bo];x.bo=!x.bo;rerender()}
  else if(d.crw){const x=card[+d.crw],L=crewOf(me(),x.t==='m'?'road':'prod'),used=card.filter(y=>y!==x&&y.t===x.t&&y.cr!=null).map(y=>y.cr);let n=x.cr==null?0:x.cr+1;while(n<L.length&&used.includes(n))n++;x.cr=n<L.length?n:null;rerender()}
  else if(d.tt){const x=card[+d.tt],o=titleOpts(G.me,x,card);const k=o.findIndex(t=>t.id===x.title);x.title=k<0?o[0].id:(o[k+1]?.id||null);rerender()}
  else if(t.id==='addm')dMatch();else if(t.id==='adds')dSeg();
  else if(t.id==='adda'){if(card.filter(x=>x.t==='a').length>=3)return;card.push({t:'a'});rerender()}
  else if(t.id==='tnew')dTour();
  else if(t.id==='tround'){const ok=tourRound().filter(p=>p.every(id=>canWork(W(id))));if(!ok.length){alert('Someone in this round is unavailable. Try next week.');return}ok.forEach(p=>G.card.push({t:'m',sides:[[p[0]],[p[1]]],win:null,fin:null,tour:1}));rerender()}
  else if(t.id==='auto'){G.card=aiCard(me());rerender()}
  else if(t.id==='run')runPlayer();
  else if(t.id==='skip'){const m=me();m.pop=clamp(m.pop-1,1,100);m.cash-=wageBill(G.me);news('You skipped this week. Wages were still paid and popularity slipped.','me');advance();render()}
});
const rerender=()=>{save();render()};
const dlg=$('#dlg');
const openD=(html,cls)=>{$('#dlgc').innerHTML=html;dlg.className=cls||'';if(!dlg.open)dlg.showModal()};
const closeD=()=>dlg.close();
const used=()=>new Set(G.card.filter(x=>x.t==='m').flatMap(x=>x.sides.flat()));

function feudCards(){const L=FE().filter(f=>f.st==='cur'&&f.co===G.me&&f.p.slice(0,2).every(p=>p.every(id=>canWork(W(id))))).sort((a,b)=>b.heat-a.heat);
  if(!L.length)return '';
  return `<div class="fcards" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin:6px 0 10px">${L.map(f=>{const h=Math.round(f.heat),sl=staleOf(f);return `<button class="fcard" data-fm="${f.id}" style="--hc:${heatCol(h)};text-align:left;font-weight:500;min-height:0" title="Add this feud as a match"><span class="ft"><span class="fr">${esc(f.why)}</span><span class="fh" style="font-size:20px">🔥 ${h}</span></span><span class="fn" style="font-size:15px">${esc(fName(f))}</span><span class="sub">Staleness ${sl} / 6 · ${feudLen(f)}${f.p.length>2?' · first two sides':''}</span></button>`}).join('')}</div>`}
function feudMatch(f){const ps=f.p.slice(0,2).map(p=>p.slice(0,2));const n=Math.min(ps[0].length,ps[1].length);return {t:'m',sides:[ps[0].slice(0,n),ps[1].slice(0,n)],win:null,fin:null}}
const MTYPES={single:{l:'Singles',n:2,per:1},tag:{l:'Tag team',n:2,per:2},trios:{l:'Six-person tag',n:2,per:3},triple:{l:'Triple threat',n:3,per:1},four:{l:'Four-way',n:4,per:1},multi:{l:'Battle royal / rumble (5+)',n:0,per:1}};
function dMatch(){
  let type='single',sl=[[],[]],act=0,gk='';const r=roster(G.me).filter(canWork).filter(w=>canBrand(w,me())).sort((a,b)=>b.pop-a.pop),u=used();
  const draw=()=>{const T=MTYPES[type],per=T.per;if(type==='multi'){sl=sl.filter(x=>x.length);sl.push([])}const ns=type==='multi'?sl.filter(x=>x.length).length:T.n;if(!GIMS.find(g=>g.k===gk&&gimFits(g,Math.max(ns,type==='multi'?5:ns))))gk='';
    openD(`<div class="dh"><h3>Add a match</h3><div>Click wrestlers to fill each side</div></div><div class="db">
    ${feudCards()?`<label>Current feuds: click one to book it</label>${feudCards()}`:''}
    <div class="chips" id="mt">${Object.entries(MTYPES).map(([k,v])=>`<button data-ty="${k}" class="${type===k?'sel':''}">${v.l}</button>`).join('')}</div>
    ${MTYPES[type].per===2&&TM().some(t=>t.st!=='past'&&t.co===G.me&&t.kind==='tag'&&t.m.length===2)?`<label style="margin-top:10px">Your tag teams</label><div class="chips">${TM().filter(t=>t.st!=='past'&&t.co===G.me&&t.kind==='tag'&&t.m.length===2).map(t=>`<button data-tm="${t.id}" ${t.m.some(x=>sl.flat().includes(x)||u.has(x)||W(x).mgr)?'disabled':''}>${esc(t.name)}</button>`).join('')}</div>`:''}
    ${type==='multi'?`<div class="slot" style="margin:8px 0 12px">${sl.flat().map(id=>`<button class="sm" data-un="m:${id}">${esc(W(id).name)} ✕</button>`).join('')||'<span class="sub">Pick 5 or more wrestlers. Each one is on their own.</span>'}</div>`:`<div class="slots" style="grid-template-columns:repeat(${T.n},minmax(0,1fr))">${sl.map((x,s)=>`<div class="slot${act===s?' on':''}" data-sl="${s}">${x.map(id=>`<button class="sm" data-un="${s}:${id}">${esc(W(id).name)} ✕</button>`).join('')||`<span class="sub">Side ${s+1}: pick ${per}</span>`}</div>`).join('')}</div>`}
    <label>Match gimmick${gimSel(gk,type==='multi'?Math.max(5,ns):T.n,'mgm')}</label><p class="hint" style="margin-top:2px">${gimInfo(GIMS.find(g=>g.k===gk)||GIMS[0])}</p>
    <div class="chips">${r.map(w=>{const inS=sl.flat().includes(w.id),bus=u.has(w.id);return `<button data-pk="${w.id}" ${inS||bus?'disabled':''}>${esc(w.name)}${w.legend?' ★':''}<small>${pd(w)} · ${w.align}</small></button>`}).join('')}</div>
    <p class="hint">Dimmed wrestlers are already in a match on this card.${type==='tag'?' Any two wrestlers can team up for the night. Official tag teams get a small teamwork bonus.':''}</p>
    <div class="dfoot"><button data-x="1">Cancel</button><button class="go" id="mok" ${type==='multi'?(ns>=5?'':'disabled'):sl.every(x=>x.length===per)?'':'disabled'}>Add to card</button></div></div>`);const mg=$('#mgm');if(mg)mg.onchange=e=>{gk=e.target.value;draw()}};
  dlg.onclick=e=>{const b=e.target.closest('button,.slot');if(!b)return;const d=b.dataset,per=MTYPES[type].per;
    if(d.ty){type=d.ty;sl=type==='multi'?[[]]:Array.from({length:MTYPES[type].n},()=>[]);act=0;draw()}
    else if(d.un){const[s,id]=d.un.split(':');if(s==='m')sl=sl.filter(x=>!x.includes(id));else{sl[+s]=sl[+s].filter(x=>x!==id);act=+s}draw()}
    else if(d.sl!=null){act=+d.sl;draw()}
    else if(d.fm){const f=FE().find(x=>x.id===d.fm),x=feudMatch(f);if(x.sides.flat().some(id=>u.has(id))){alert('One of them is already in a match on this card.');return}G.card.push(x);closeD();rerender()}
    else if(d.tm){const t=grp(d.tm);const k=sl.findIndex(x=>!x.length);if(k>=0){sl[k]=t.m.slice(0,MTYPES[type].per);const k2=sl.findIndex(x=>!x.length);act=k2>=0?k2:0}draw()}
    else if(d.pk){if(type==='multi'){sl=sl.filter(x=>x.length);sl.push([d.pk]);draw();return}if(sl[act].length>=per){const k=sl.findIndex(x=>x.length<per);if(k>=0)act=k}if(sl[act].length<per)sl[act].push(d.pk);if(sl[act].length>=per){const k=sl.findIndex(x=>x.length<per);if(k>=0)act=k}draw()}
    else if(d.x)closeD();
    else if(b.id==='mok'){G.card.push({t:'m',sides:sl.filter(x=>x.length),win:null,fin:null,gm:gk||undefined});closeD();rerender()}};
  draw();
}
function dSeg(){
  let g='Promo',who=[],oc='';const r=roster(G.me).filter(w=>!isOut(w)&&canBrand(w,me())).sort((a,b)=>b.cha-a.cha);
  const draw=()=>openD(`<div class="dh"><h3>Add a segment</h3><div>Segments build popularity through Charisma</div></div><div class="db">
   <label>Type</label><div class="chips">${Object.keys(SEG).map(t=>`<button data-g="${t}" class="${t===g?'sel':''}">${t}</button>`).join('')}</div>
   ${TM().some(t=>t.st!=='past'&&t.co===G.me)?`<label>Tag teams and factions</label><div class="chips">${TM().filter(t=>t.st!=='past'&&t.co===G.me).map(t=>`<button data-tg="${t.id}" class="${t.m.every(x=>who.includes(x))?'sel':''}">${esc(t.name)}<small>${t.kind==='tag'?'team':'faction'}</small></button>`).join('')}</div>`:''}
   <label>Featuring (1 to 6)</label><div class="chips">${r.map(w=>`<button data-w="${w.id}" class="${who.includes(w.id)?'sel':''}">${esc(w.name)}<small>Cha ${w.cha}</small></button>`).join('')}</div>
   <p class="hint" style="margin:0">${SEG[g]}</p>
   ${who.length?`<label style="margin-top:12px">Outcome (optional)</label><div class="chips">${segOuts(g,who).map(([x,l])=>`<button data-oc="${x}" class="${oc===x?'sel':''}">${l}</button>`).join('')}</div>`:''}
   <div class="dfoot"><button data-x="1">Cancel</button><button class="go" id="sok" ${who.length?'':'disabled'}>Add to card</button></div></div>`);
  dlg.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.g){g=d.g;draw()}else if(d.w){who=who.includes(d.w)?who.filter(x=>x!==d.w):[...who,d.w].slice(-6);draw()}
    else if(d.tg){const t=grp(d.tg);who=t.m.every(x=>who.includes(x))?who.filter(x=>!t.m.includes(x)):[...new Set([...who,...t.m])].slice(-6);draw()}
    else if(d.oc!=null){oc=d.oc;draw()}
    else if(d.x)closeD();else if(b.id==='sok'){const lastM=G.card.map(x=>x.t).lastIndexOf('m');G.card.splice(lastM<0?G.card.length:lastM,0,{t:'s',g,who,oc:segOuts(g,who).some(o=>o[0]===oc)?oc:''});closeD();rerender()}};
  draw();
}
function segOuts(g,who){const W0=W(who[0]),o=[['','None']];const sides=segSides(who);
  o.push(['turn',`${W0.name} turns ${W0.align==='H'?'face':'heel'}`]);if(W0.align!=='T')o.push(['tween',`${W0.name} goes tweener`]);
  if(g==='Attack'&&who[1])o.push(['injure',`${W(who[1]).name} is injured`]);
  if(sides.length>=2&&sides.every(x=>!x.g))o.push(['team',who.length<=4?'They form a tag team':'They form a faction']);
  if(sides.length>=2&&sides.some(x=>x.g))o.push(['team','They form a faction']);
  const gs=[...new Set(who.flatMap(id=>grpsOf(id)).map(t=>t.id))];if(gs.length)o.push(['split',`${grp(gs[0]).name} splits up`]);
  if(['Promo','Challenge','Contract signing'].includes(g))o.push(['shot',`${W0.name} earns a title shot`]);return o}
function gimSel(cur,n,id='gsel'){const cats=[...new Set(GIMS.map(g=>g.cat))];return `<select id="${id}">${cats.map(c=>`<optgroup label="${c}">${GIMS.filter(g=>g.cat===c&&gimFits(g,n)).map(g=>`<option value="${g.k}" ${g.k===cur?'selected':''}>${esc(g.name)}${g.cost?` · ${money(g.cost)}`:''}</option>`).join('')}</optgroup>`).join('')}</select>`}
const gimInfo=g=>`${g.cost?`Costs ${money(g.cost)} to put on. `:'No extra cost. '}${g.rate>0?`Rating +${g.rate}. `:''}${g.inj>=.05?'High injury risk. ':g.inj>=.03?'Some injury risk. ':''}${g.heat?`Feud heat +${g.heat}. `:''}${g.nodq?'No disqualifications or count-outs. ':''}${g.only?`Only wins by ${g.only.toLowerCase()}. `:''}${g.out==='hair'?'Loser gets shaved. ':g.out==='mask'?'Loser is unmasked. ':g.out==='leave'?'Loser leaves the company. ':g.out==='career'?'If the challenger loses, they retire. ':''}`;
function dGim(i){const x=G.card[i];let k=x.gm||'';const draw=()=>{openD(`<div class="dh"><h3>Match type</h3><div>${esc(vsTxt(x))}</div></div><div class="db"><label>Gimmick${gimSel(k,x.sides.length)}</label><p class="hint">${gimInfo(GIMS.find(g=>g.k===k)||GIMS[0])}</p><div class="dfoot"><button data-x="1">Cancel</button><button class="go" id="gmok">Set</button></div></div>`);$('#gsel').onchange=e=>{k=e.target.value;draw()}};

function gwForm(w){if(!G.opts.sandbox&&!w.fresh&&w.co!==G.me)return `<p class="sub" style="margin:0">Only wrestlers on your roster can be changed. Sign them first, or turn on Sandbox to edit anyone.</p>`;const sb=!!G.opts.sandbox,cs=Object.values(G.cos).sort((a,b)=>a.short.localeCompare(b.short));const coOpts=cur=>`<option value="">Free agent</option>`+cs.filter(c=>c.active).map(c=>`<option value="${c.id}" ${cur===c.id?'selected':''}>${esc(c.short)}</option>`).join('');return `<div class="form">
   <label class="wide">Ring name<input data-g="name" value="${esc(w.name)}"></label>
   <label>Gender<select data-g="gender">${['M','F',''].map(g=>`<option value="${g}" ${w.gender===g?'selected':''}>${g==='M'?'Male':g==='F'?'Female':'Other'}</option>`).join('')}</select></label>
   <label class="wide">Alignment: <b data-alv>${alName(w.al??alDefault(w.align))}</b>${alBar('',w.al??alDefault(w.align),'data-g="al"')}</label>
   <label>Weight (lbs)<input type="number" min="0" max="700" data-g="wt" value="${w.wt||''}"></label>
   <label>Legend<select data-g="legend" ${sb||w.fresh?'':'disabled'}><option value="" ${w.legend?'':'selected'}>No</option><option value="1" ${w.legend?'selected':''}>Yes</option></select></label>
   <label>Gimmick<select data-g="gim">${GIM.map(g=>`<option ${w.gim===g?'selected':''}>${g}</option>`).join('')}</select></label>
   <label>Birth date<input type="date" data-g="birth" value="${esc(w.birth)}"></label>
   <label>Debut date<input type="date" data-g="debut" value="${esc(w.debut)}"></label>
   <label>Leaves the business<input type="date" data-g="retire" value="${esc(w.retire)}"></label>
   <label>Charisma<input type="number" min="0" max="100" data-g="cha" value="${w.cha}" ${sb||w.fresh?'':'disabled'}></label>
   <label>Workrate<input type="number" min="0" max="100" data-g="wrk" value="${w.wrk}" ${sb||w.fresh?'':'disabled'}></label>
   ${XSTATS.map(x=>`<label>${x.name}<input type="number" min="1" max="100" data-g="${x.k}" value="${pst(w,x.k)}" ${sb||w.fresh?'':'disabled'}></label>`).join('')}
   <label>Personality<select data-g="per" ${sb||w.fresh?'':'disabled'}>${Object.entries(PERS).map(([k,v])=>`<option value="${k}" ${perOf(w)===k?'selected':''}>${v.name}</option>`).join('')}</select></label>
   ${[0,1].map(i=>`<label>Specialty ${i+1}<select data-g="spec${i}" ${sb||w.fresh?'':'disabled'}><option value="">None</option>${Object.entries(SPECS).map(([k,v])=>`<option value="${k}" ${specOf(w)[i]===k?'selected':''}>${v.name}</option>`).join('')}</select></label>`).join('')}
   <label>Popularity (10 to 3,000)<input type="number" min="10" max="3000" data-g="pop" value="${Math.round(fameOf(w))}" ${sb||w.fresh?'':'disabled'}></label>
   <label>Momentum (0 cold, 100 hot)<input type="number" min="0" max="100" data-g="mom" value="${Math.round(w.mom)}" ${sb||w.fresh?'':'disabled'}></label>
   ${w.fresh?'<div class="msg wide" style="margin:0">New superstar: set the stats now. They lock when you press Done or when the week ends. <button class="sm go" id="gdone" style="margin-left:8px">Done</button></div>':sb?'':'<p class="hint wide" style="margin:0">Stats, popularity, momentum and Legend status change only through play. Turn on Sandbox to edit them.</p>'}
   <p class="hint wide" style="margin:0">Status: ${w.status==='future'?`Future Superstar, debuts ${fmtDate(w.debut)}`:w.status==='retired'?'Left the business':w.co?`Signed to ${esc(co(w.co).name)}`:'Free agent'}. A debut date after today makes an unsigned wrestler a Future Superstar.</p>
   ${w.status==='retired'?`<div class="wide"><button id="gback">Bring back as a free agent</button></div>`:''}
   ${sb&&w.status==='active'?`<div class="wide" style="border-top:1px solid var(--line);padding-top:12px"><b>Sandbox: contract</b></div>
   <label>Company<select data-g="co">${coOpts(w.co)}</select></label>
   <label>Wage per show<input type="number" min="0" step="10" data-g="wage" value="${w.wage}" ${w.co?'':'disabled'}></label>
   <label>Major Events left<input type="number" min="1" max="24" data-g="left" value="${w.left||1}" ${w.co?'':'disabled'}></label>`:''}</div>`}
const gView=()=>tab==='superstars'?vStar():vEdit();
function vEdit(){
  const sb=!!G.opts.sandbox,q=gq.toLowerCase();
  const ws=Object.values(G.ws).sort((a,b)=>a.name.localeCompare(b.name)),cs=Object.values(G.cos).sort((a,b)=>a.short.localeCompare(b.short));
  const items=gcat==='w'?ws:cs,sel=gsel&&(gcat==='w'?G.ws[gsel]:G.cos[gsel]);
  const stTxt=w=>w.status==='future'?'Future':w.status==='retired'?'Left':w.co?esc(co(w.co).short):'FA';
  const coOpts=cur=>`<option value="">Free agent</option>`+cs.filter(c=>c.active).map(c=>`<option value="${c.id}" ${cur===c.id?'selected':''}>${esc(c.short)}</option>`).join('');
  const wForm=gwForm;
  const cForm=c=>`<div class="form">
   <label class="wide">Company name<input data-g="name" value="${esc(c.name)}"></label>
   <label>Short name<input data-g="short" value="${esc(c.short)}"></label>
   <label>Popularity<input type="number" min="1" max="100" data-g="pop" value="${Math.round(c.pop)}" ${sb?'':'disabled'}></label>
   <label>Opens<input type="date" data-g="open" value="${esc(c.open)}" ${c.active||c.closed?'disabled':''}></label>
   <label>Closes (blank for never)<input type="date" data-g="close" value="${esc(c.close)}" ${c.closed?'disabled':''}></label>
   <label class="wide">Upcoming renames, one per line as date | short name | full name<textarea data-g="renames" rows="3">${esc(c.renames.filter(r=>r.date>G.date).map(r=>`${r.date} | ${r.short} | ${r.name}`).join('\n'))}</textarea></label>
   ${imgField('co:'+c.id,c.logo,'Company logo')}
   <label>Major Events<select data-g="cyc">${Object.entries(CYC).map(([k,l])=>`<option value="${k}" ${String(c.cyc||1)===k?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Weekly show name<input data-g="weeklyName" value="${esc(wkName(c))}"></label>
   <label>Next Major Event name<input data-g="majorName" value="${esc(c.majorName)}"></label>
   <label>Hype (0 to 100)<input type="number" min="0" max="100" data-g="hype" value="${Math.round(c.hype)}" ${sb?'':'disabled'}></label>
   <p class="hint wide" style="margin:0">Status: ${c.closed?'Closed':c.active?`Open, owned by ${c.owner==='player'?'you':'the computer'}`:`Opens ${fmtDate(c.open)}`}. Moving a close date to today or earlier closes a rival company at the end of this week.</p>
   ${sb?`<div class="wide" style="border-top:1px solid var(--line);padding-top:12px"><b>Sandbox: money</b></div><label>Bank<input type="number" step="1000" data-g="cash" value="${Math.round(c.cash)}"></label>`:''}</div>`;
  $('#app').innerHTML=`<div class="head"><div><h2>Edit this game</h2><p>Changes apply to the game you're playing right now and save straight away. The Scenario editor is for setting up new games.</p></div>
   <div class="btns"><label style="display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600"><input type="checkbox" id="gsb" ${sb?'checked':''}>Sandbox: allow editing stats, money and contracts</label></div></div>
   ${gmsg?`<div class="msg" style="margin:0 0 16px">${esc(gmsg)}</div>`:''}
   <div class="grid side">
   <div class="panel"><div class="seg2"><button data-gc="w" class="${gcat==='w'?'on':''}">Wrestlers (${ws.length})</button><button data-gc="c" class="${gcat==='c'?'on':''}">Companies (${cs.length})</button></div>
    <input id="gq" placeholder="Search" value="${esc(gq)}" style="margin-top:10px">
    <div class="list">${items.filter(x=>!q||x.name.toLowerCase().includes(q)||(x.short||'').toLowerCase().includes(q)).map(x=>`<button data-gs="${x.id}" class="${x.id===gsel?'sel':''}"><span>${esc(gcat==='c'?x.short+' · '+x.name:x.name)}</span><span class="sub">${gcat==='w'?stTxt(x):x.closed?'Closed':x.active?'Open':'Later'}</span></button>`).join('')}</div>
    <button style="width:100%;margin-top:10px" id="gadd">Add ${gcat==='w'?'wrestler':'company'}</button></div>
   <div class="panel">${sel?`<h3>${esc(sel.name)}</h3>${gcat==='w'?wForm(sel):cForm(sel)}`:'<div class="empty">Pick a wrestler or company to edit, or add a new one.</div>'}</div></div>`;
}
function gApply(t){
  const f=t.dataset.g,x=gcat==='w'?G.ws[gsel]:G.cos[gsel];if(!x)return;let v=t.value;
  if(!G.opts.sandbox&&!(gcat==='w'&&x.fresh&&['cha','wrk','pop','mom','legend',...['per','spec0','spec1',...XSTATS.map(x=>x.k)]].includes(f))&&['cha','wrk','pop','mom','legend','hype','cash','co','wage','left',...['per','spec0','spec1',...XSTATS.map(x=>x.k)]].includes(f))return;
  if(gcat==='w'){
    if(f==='pop'&&gcat==='w'){x.fame=null;setFame(x,+v||10)}
    else if(gcat==='w'&&XSTATS.some(q=>q.k===f))x[f]=clamp(+v||1,1,100);
    else if(gcat==='w'&&f==='per'){if(PERS[v])x.per=v}
    else if(gcat==='w'&&(f==='spec0'||f==='spec1')){const sp=specOf(x).slice();sp[f==='spec0'?0:1]=v;x.spec=sp.filter((k,i,a)=>SPECS[k]&&a.indexOf(k)===i)}
    else if(['cha','wrk','pop','mom'].includes(f))x[f]=clamp(+v||0,0,100);
    else if(f==='wt')x.wt=clamp(+v||0,0,700);
    else if(f==='al'){x.al=clamp(+v,-100,100);x.align=alLetter(x.al);const l=document.querySelector('[data-alv]');if(l)l.textContent=alName(x.al)}
    else if(f==='legend'){x.legend=!!v;if(!v)x.lp=0}
    else if(f==='wage')x.wage=Math.max(0,+v||0);
    else if(f==='left')x.left=clamp(+v||1,1,24);
    else if(f==='co'){if(!v)freeW(x);else if(v!==x.co){const nw=!x.co;x.co=v;x.next=null;G.offers=G.offers.filter(o=>o.w!==x.id);if(nw){x.wage=worth(x);x.left=3}}gmsg='';gView()}
    else if(f==='debut'){x.debut=v;if(x.status==='active'&&!x.co&&v&&v>G.date)x.status='future';else if(x.status==='future'&&(!v||v<=G.date))x.status='active'}
    else x[f]=v;
  }else{
    if(['pop','hype'].includes(f))x[f]=clamp(+v||0,f==='pop'?1:0,100);
    else if(f==='cash')x.cash=+v||0;
    else if(f==='cyc'){x.cyc=+v||1;x.cycFix=1;syncSched()}
    else if(f==='renames')x.renames=[...x.renames.filter(r=>r.date<=G.date),...v.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>normDate(p[0])>G.date).map(p=>({date:normDate(p[0]),short:p[1]||x.short,name:p[2]||p[1]||x.name}))];
    else if(f==='open'){x.open=v;if(!x.active&&!x.closed&&v&&v<=G.date){x.active=true;x.cash=20000+x.pop*600;news(`${x.name} (${x.short}) opens for business.`,'co');gmsg=`${x.short} is open now.`;gView()}}
    else if(f==='close'){x.close=v;if(x.active&&v&&v<=G.date&&x.owner==='ai'){closeCo(x,'closes its doors');gmsg=`${x.short} has closed.`;gView()}}
    else x[f]=v;
  }
  save();renderHdr();
}
document.addEventListener('input',e=>{if(!['edit','superstars'].includes(tab)||!G)return;const t=e.target;
  if(t.id==='gq'){gq=t.value;const p=t.selectionStart;gView();const j=$('#gq');j.focus();j.setSelectionRange(p,p);return}
  if(t.dataset.g&&t.tagName!=='SELECT')gApply(t)});
document.addEventListener('change',e=>{if(!['edit','superstars'].includes(tab)||!G)return;const t=e.target;
  if(t.id==='gsb'){G.opts.sandbox=t.checked;save();gView();return}
  if(t.dataset.g&&t.tagName==='SELECT')gApply(t);
  else if(t.dataset.g&&['name','short','open','close','debut'].includes(t.dataset.g))gView()});
document.addEventListener('click',e=>{if(!['edit','superstars'].includes(tab)||!G)return;const t=e.target.closest('button');if(!t||!$('#app').contains(t))return;const d=t.dataset;
  if(d.gc){gcat=d.gc;gsel=null;gq='';gmsg='';gView()}
  else if(d.gs){gsel=d.gs;gmsg='';gView()}
  else if(t.id==='gdone'){delete G.ws[gsel].fresh;save();gView()}
  else if(t.id==='gback'){const w=G.ws[gsel];w.status='active';w.retire='';news(`${w.name} returns to the business as a free agent.`);save();gView()}
  else if(t.id==='gadd'){
    if(gcat==='w'){let i=0;while(G.ws['e'+i])i++;const id='e'+i,y=+G.date.slice(0,4)-22;
      G.ws[id]={id,name:'New wrestler',gender:'M',birth:`${y}-01-01`,debut:G.date,retire:'',align:'F',gim:'None',cha:50,wrk:50,pop:10,mom:50,status:'active',co:null,wage:0,left:0,next:null,riv:{},last:0,gm:0,fresh:true};gsel=id;gmsg='Added as a free agent. Set a later debut date to make them a Future Superstar.'}
    else{let i=0;while(G.cos['x'+i])i++;const id='x'+i;
      G.cos[id]={id,short:'NEW',name:'New company',open:addDays(G.date,365),close:'',renames:[],pop:30,cash:0,active:false,closed:false,owner:'ai',cyc:2,weeklyLeft:0,majorName:pick(EVN),hype:30,lastRating:null,broke:0};syncSched();gsel=id;gmsg='Added with an opening date one year from now. Change it to any date; today or earlier opens it straight away.'}
    gq='';save();gView()}
});

/* ----- superstars ----- */
let sq='',sf='mine';
function vStar(){
  const q=sq.toLowerCase();
  let L=Object.values(G.ws);if(sf==='mine')L=L.filter(w=>w.co===G.me&&w.status==='active');else if(sf==='active')L=L.filter(w=>w.status==='active');
  L=L.filter(w=>!q||w.name.toLowerCase().includes(q)).sort((a,b)=>b.pop-a.pop);
  if(gcat!=='w'){gcat='w';gsel=null}
  if(!gsel||!G.ws[gsel])gsel=L[0]?.id||null;
  const w=gsel&&G.ws[gsel];
  const tile=(l,v,max=100,extra='')=>`<div class="tile"><div class="sub">${l}</div><b>${v}</b>${max?`<div class="meter" style="margin:6px 0 0"><i style="width:${clamp(+v,0,100)}%"></i></div>`:''}${extra}</div>`;
  const status=w=>w.status==='future'?`Future Superstar, debuts ${fmtDate(w.debut)}`:w.status==='retired'?'Left the business':w.co?`${esc(co(w.co).name)} · ${money(w.wage)}/show · ${w.left} Major Event${w.left===1?'':'s'} left${w.next?` · moving to ${esc(co(w.next.co).short)}`:''}`:'Free agent';
  const rec=w?.rec||{w:0,l:0,d:0};
  const RL={w:'Win',l:'Loss',d:'Draw'};
  $('#app').innerHTML=`<div class="head"><div><h2>Superstars</h2><p>Profiles for every wrestler. Edit anything in the panel under the profile.</p></div>
   <div class="seg2">${[['mine','My roster'],['active','All active'],['all','Everyone']].map(([k,l])=>`<button data-sf="${k}" class="${sf===k?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="grid side">
   <div class="panel"><input id="sq" placeholder="Search" value="${esc(sq)}"><div class="list">${L.map(x=>`<button data-ss="${x.id}" class="${x.id===gsel?'sel':''}"><span style="display:flex;align-items:center;min-width:0">${headImg(x,22)}${esc(x.name)}</span><span class="sub">${pd(x)}</span></button>`).join('')||'<div class="empty">Nobody here.</div>'}</div></div>
   <div>${w?`<div class="panel prof"><div class="ph"><div>${w.logo?`<img class="logo" src="${w.logo}" alt="" style="width:84px;height:84px;float:left;margin:0 14px 6px 0">`:bodyImg(w)}<h2 style="font-size:clamp(30px,5vw,48px)">${esc(w.name)}</h2>${w.legend||holds(w).length?'<div style="margin:4px 0">'+lgTxt(w)+chTxt(w)+'</div>':''}
     <div class="sub" style="font-size:15px;margin-top:4px">${age(w)!=null?`Age ${age(w)} · `:''}${w.wt?`${w.wt} lbs · `:''}${alTxt(w.align)}${w.gim&&w.gim!=='None'?` · ${esc(w.gim)}${gfit(w)?' (good fit)':' (poor fit)'}`:''} · ${momTxt(w)}</div>
     <div style="margin-top:6px">${status(w)}</div></div>
     <div class="btns">${w.co===G.me?`<button class="sm go" data-sct="${w.id}">Contract</button><button class="sm" data-sgm="${w.id}">Gimmick</button>`:w.status==='active'?(!w.co||w.left<=2&&!w.next?`<button class="sm go" data-sct="${w.id}">Negotiate</button>`:`<button class="sm" disabled title="Talks open with 2 or fewer Major Events left">Negotiate</button><div class="sub" style="width:100%;text-align:right">${w.next?'Already signed elsewhere next':'Opens with 2 events left'}</div>`):w.status==='future'?`<button class="sm" disabled>Negotiate</button><div class="sub" style="width:100%;text-align:right">After debut</div>`:''}</div></div>
     <div class="tiles">${tile('Charisma',w.cha)}${tile('Workrate',w.wrk)}${tile('Popularity',pd(w),0,`<div class="sub">${tierOf(w)[1]}${ascOf(w)?' (ascended)':''}</div>`)}${tile('Momentum',Math.round(w.mom))}${tile('Worth per show',money(worth(w)),0)}${(()=>{const f=fameOf(w),nx=PTIERS.find(x=>x[0]>f);if(!nx)return tile('Status','Hall of Famer',0,'<div class="sub">The highest status there is</div>');const cur=tierOf(w);return tile('Next status',nx[1],0,`<div class="meter" style="margin:6px 0 0"><i style="width:${Math.round((f-cur[0])/(nx[0]-cur[0])*100)}%"></i></div><div class="sub">${Math.round(f).toLocaleString('en-US')} / ${nx[0].toLocaleString('en-US')}${nx[2]?' · ascended tiers need less booking to stay popular':''}${w.legend?'<br>Legend: worth +25%, bigger crowds, never below 1,000':''}</div>`)})()}</div>
     ${profSheet(w)}
     ${profCareer(w)}
     <h3 style="margin-top:16px">Recent matches</h3>${(w.hist||[]).length?`<div><table class="stack"><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th>Finish</th><th class="n">Rating</th></tr></thead><tbody>${w.hist.map(h=>`<tr><td style="white-space:nowrap">${fmtDate(h.date)}</td><td>${esc(h.vs)}${h.main?' <span class="k me">Main</span>':''}${h.major?' <span class="k of">Major</span>':''}</td><td class="${h.r==='w'?'pos':h.r==='l'?'neg':''}">${RL[h.r]}</td><td>${esc(h.fin)}</td><td class="n">${stars(h.st)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:12px">No matches yet.</div>'}
     ${profActs(w)}</div>
     <div class="panel" style="margin-top:20px"><h3>Edit superstar (full form)</h3>${gmsg?`<div class="msg" style="margin:0 0 12px">${esc(gmsg)}</div>`:''}${gwForm(w)}
     <label style="margin-top:12px"><input type="checkbox" id="gsb" ${G.opts.sandbox?'checked':''}>Sandbox: allow editing stats and contracts</label></div>`
   :'<div class="panel empty">Pick a wrestler on the left.</div>'}</div></div>`;
}
function profCareer(w){
  const rs=Object.values(G.titles||{}).flatMap(t=>(t.reigns||[]).filter(r=>r.h&&r.h.includes(w.id)||!r.h?.length&&r.hn===w.name).map(r=>({t,r}))).sort((a,b)=>(a.r.won||'')<(b.r.won||'')?-1:1);
  const cr=w.car||{},aws=(G.awards||[]).flatMap(a=>[a.woty&&a.woty.name===w.name?`${a.y} Wrestler of the Year`:null,a.moty&&a.moty.txt.includes(w.name)?`${a.y} Match of the Year (${a.moty.txt})`:null]).filter(Boolean);
  const days=r=>r.won?daysBetween(r.won,r.lost||G.date):null,defs=r=>r.def.filter(x=>/retains/.test(x.res)).length;
  const acc=[...aws.map(a=>'🏅 '+a),...(w.asc||[]).map(x=>`⬆ Ascended: ${x.t} (${fmtDate(x.d)})`),...(w.hof?[`🏛 Hall of Fame (${fmtDate(w.hof)})`]:[]),...(w.chof||[]).map(x=>`🏛 ${x} Hall of Fame`),...(w.legend&&!(w.asc||[]).some(x=>x.t==='Legend')?['★ Became a Legend']:[]),...rs.filter(x=>!x.r.pre).map(x=>`🏆 Won the ${x.t.name}${x.r.wonAt?` at ${x.r.wonAt}`:''} (${fmtDate(x.r.won)})`)];
  const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
  return `<h3 style="margin-top:18px">Career</h3><div class="sheet" style="margin-top:6px">
   ${kv('Main events',`${cr.main||0} <span class="sub">${cr.mainW||0} won</span>`)}${kv('Opening matches',cr.open||0)}${kv('Major Event matches',`${cr.maj||0} <span class="sub">${cr.majW||0} won</span>`)}${kv('Title matches',cr.tm||0)}

  else if(d.slotPlay){const n=+d.slotPlay;if(G&&G.slot===n){location.hash='book';return}slotLoad(n).then(ok=>{if(ok){rview='mine';location.hash='book';render()}})}
  else if(d.slotDel){const n=+d.slotDel,x=slotMeta()[n];if(!confirm(`Delete the save in slot ${n}${x?` (${x.name}, ${fmtDate(x.date)})`:''}? This can't be undone.`))return;slotDelete(n).then(()=>vHome())}
  else if(d.slotNew){NG.slot=+d.slotNew;location.hash='new'}
  else if(t.id==='hnew'){location.hash='new'}
  else if(t.id==='hed'){location.hash='editor'}
  else if(d.hp){const v=scenFrom(d.hp);NG.src=d.hp;NG.start=v.start;NG.choice=null;location.hash='new'}
  else if(d.he){const v=scenFrom(d.he);ED=clone(v);if(d.he==='builtin')ED.name=v.name+' (my version)';esel=null;edSave();location.hash='editor'}
  else if(d.hd){const k=d.hd.slice(2);if(!confirm(`Delete the scenario "${k}"? Games already started from it are not affected.`))return;const sc=store.get('ro_scens')||{};delete sc[k];store.set('ro_scens',sc);vHome()}
});
let NG={slot:null,src:'builtin',start:null,choice:null,retire:true,gen:true,diff:'relaxed',inj:'normal',nn:'',ns:'',np:30};
function scenList(){const saved=store.get('ro_scens')||{};const L=[['builtin',BUILTIN.name+' (built in)']];if(ED)L.push(['editor',`${ED.name} (in the editor)`]);Object.keys(saved).forEach(k=>L.push(['s:'+k,k+' (saved)']));return L}
function scenFrom(src){if(src==='editor'&&ED)return ED;if(src.startsWith('s:'))return (store.get('ro_scens')||{})[src.slice(2)]||BUILTIN;return BUILTIN}
function vNew(){
  const sc=scenFrom(NG.src);if(!NG.start)NG.start=sc.start;
  const open=sc.companies.map((c,i)=>({c,i})).filter(({c})=>(!c.open||c.open<=NG.start)&&!(c.close&&c.close<=NG.start));
  const nameAt=c=>{let n=c.name,s=c.short;(c.renames||[]).filter(r=>r.date<=NG.start).forEach(r=>{n=r.name||n;s=r.short||s});return [s,n]};
  const saved=store.get('ro_save');
  const scs=scenList(),topOf=v=>{const L=(v.wrestlers||[]).map((w,i)=>({w,i})).sort((a,b)=>(+b.w.pop||0)-(+a.w.pop||0))[0];return L&&WL?WL.img(L.w.px?WL.normalize(L.w.px):pxSeed({id:'w'+L.i,gender:L.w.gender}),{crop:'bust',size:56}):''};
  $('#app').innerHTML=`<div class="plate" style="margin:0 auto 6px;width:max-content"><h2 style="font-size:clamp(26px,5vw,44px)">Start a new game</h2><small>Pick a scenario, a company and how hard money is</small></div>
  ${saved&&!G?`<div class="slot" style="margin-top:14px"><div class="sl"><b>Saved game: ${esc(saved.cos[saved.me]?.name)}</b><span class="sub">${fmtDate(saved.date)}. Starting a new game replaces it.</span></div><button class="go" id="cont">Continue</button></div>`:''}
  <div class="steph">1. Choose a scenario</div>
  <div class="scards">${scs.map(([k,l],i)=>{const v=scenFrom(k);return `<button class="scard${k===NG.src?' sel':''}" data-nsrc="${esc(k)}" aria-pressed="${k===NG.src}"><div class="ban" style="--c:${BANC[i%BANC.length]}"><b>${esc((v.start||'').slice(0,4))}</b>${topOf(v)}</div><div class="bd"><b>${esc(l)}</b><span>${v.desc?esc(v.desc):`${v.companies.length} companies · ${v.wrestlers.length} wrestlers`}</span></div></button>`}).join('')}</div>
  <div class="panel" style="margin-top:12px"><div class="form"><label>Start date<input type="date" id="nstart" value="${NG.start}"></label><div><label>Jump to a year</label><div class="btns" style="margin-top:6px">${['1969','1980','1994','2001','2010'].map(y=>`<button class="sm" data-y="${y}">${y}</button>`).join('')}</div></div></div>
   <p class="hint">Starting on the scenario's own date (${fmtDate(sc.start)}) uses its home companies. Any other date starts everyone as a free agent, and rival owners sign talent before week 1.</p>
   <label style="margin-top:8px"><input type="checkbox" id="nret" ${NG.retire?'checked':''}>Retirements and deaths happen during play, based on age and gameplay</label>
   <label style="margin-top:8px"><input type="checkbox" id="ngen" ${NG.gen?'checked':''}>Add made-up wrestlers to the free agent pool (more when more companies are open)</label></div>
  <div class="steph">2. Choose your company</div>
  <div class="ccards">${open.map(({c,i})=>{const[s,n]=nameAt(c);return `<label class="ccard"><input type="radio" name="nco" value="c${i}" ${NG.choice==='c'+i?'checked':''}><div class="badge" style="--c:${BANC[i%BANC.length]}">${c.logo?`<img src="${c.logo}" alt="">`:esc(s)}</div><div class="sl"><b>${esc(n)}</b><span>${esc(s)} · ${esc(c.size||'Regional')} · popularity ${c.pop}</span></div></label>`}).join('')}
   <label class="ccard"><input type="radio" name="nco" value="new" ${NG.choice==='new'?'checked':''}><div class="badge" style="--c:#f2c230;color:#231612">NEW</div><div class="sl"><b>Start my own company</b><span>Small, cheap and all yours</span></div></label></div>
  ${NG.choice==='new'?`<div class="panel" style="margin-top:12px"><div class="form"><label class="wide">Company name<input id="nn" maxlength="50" value="${esc(NG.nn)}" placeholder="Midnight Wrestling Federation"></label><label>Short name<input id="ns" maxlength="10" value="${esc(NG.ns)}" placeholder="MWF"></label><label>Starting popularity<input id="np" type="number" min="1" max="100" value="${esc(NG.np)}"></label></div></div>`:''}
  <div class="steph">3. Money difficulty</div>
  <div class="chips">${Object.entries(DIFF).map(([k,v])=>`<button data-ndf="${k}" class="${NG.diff===k?'sel':''}">${v.name}</button>`).join('')}</div><p class="hint" style="margin:4px 0 0">${DIFF[NG.diff].hint} You can change this later in Calendar and news.</p>
  <div class="steph">4. Injuries</div>
  <div class="chips">${Object.entries(INJ_SET).map(([k,v])=>`<button data-ninj="${k}" class="${NG.inj===k?'sel':''}">${v.name}</button>`).join('')}</div><p class="hint" style="margin:4px 0 0">${INJ_SET[NG.inj].hint} Separate from money difficulty, and changeable later.</p>
  <div class="steph">5. Save slot</div>
  ${(()=>{const M=slotMeta();if(!NG.slot){NG.slot=Array.from({length:SLOTS},(_,i)=>i+1).find(n=>!M[n])||(G?.slot||store.get('ro_save')?.slot||1)}return `<div class="chips">${Array.from({length:SLOTS},(_,i)=>i+1).map(n=>`<button data-nslot="${n}" class="${NG.slot===n?'sel':''}">Slot ${n}<small>${M[n]?`${esc(M[n].short)} · ${fmtDate(M[n].date)} (replaced)`:'Empty'}</small></button>`).join('')}</div>${M[NG.slot]?`<p class="hint" style="margin:4px 0 0">Starting here replaces the ${esc(M[NG.slot].name)} save in slot ${NG.slot}.</p>`:''}`})()}
  <div class="btns" style="margin-top:18px"><button class="mbtn red" id="nstartbtn" style="width:auto;margin:0" ${NG.choice?'':'disabled'}><b>${NG.choice==='new'?'Open my company':'Take over the company'}</b></button><button id="nback" style="min-height:64px">Back</button></div>
  <p class="note">The built-in scenario uses a 1969 sheet with rough dates and starting stats. Change anything under Create.</p>`;
  document.querySelectorAll('[data-nsrc]').forEach(b=>b.onclick=()=>{NG.src=b.dataset.nsrc;NG.start=scenFrom(NG.src).start;NG.choice=null;vNew()});
  $('#nback').onclick=()=>{location.hash='home'};
  $('#nstart').onchange=e=>{if(e.target.value){NG.start=e.target.value;NG.choice=null;vNew()}};
  $('#nret').onchange=e=>NG.retire=e.target.checked;document.querySelectorAll('[data-ndf]').forEach(b=>b.onclick=()=>{NG.diff=b.dataset.ndf;vNew()});document.querySelectorAll('[data-ninj]').forEach(b=>b.onclick=()=>{NG.inj=b.dataset.ninj;vNew()});document.querySelectorAll('[data-nslot]').forEach(b=>b.onclick=()=>{NG.slot=+b.dataset.nslot;vNew()});$('#ngen').onchange=e=>NG.gen=e.target.checked;
  document.querySelectorAll('[name=nco]').forEach(r=>r.onchange=()=>{NG.choice=r.value;vNew()});
  ['nn','ns','np'].forEach(k=>{const x=$('#'+k);if(x)x.oninput=()=>NG[k]=x.value});
  document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{NG.start=b.dataset.y+'-01-01';NG.choice=null;vNew()});
  const c=$('#cont');if(c)c.onclick=()=>{G=saved;location.hash='book';render()};
  $('#nstartbtn').onclick=()=>{const ch=NG.choice==='new'?{type:'new',name:NG.nn.trim()||'My Promotion',short:NG.ns.trim()||'MINE',pop:clamp(+NG.np||30,1,100),cash:60000}:{type:'existing',id:NG.choice};
    const slot=NG.slot||1;const go=()=>{newGame(clone(sc),NG.start,ch,{retire:NG.retire,gen:NG.gen,diff:NG.diff,inj:NG.inj,slot});G.slot=slot;G.scenName=sc.name;NG.slot=null;save();tab='book';rview='mine';if(location.hash==='#book')render();else location.hash='book'};
    if(!G&&store.get('ro_save'))G=store.get('ro_save');(G?slotFlush():Promise.resolve()).then(go)};
}

   <label>Hall of Fame at popularity<input type="number" min="100" max="3000" step="50" data-f="hofAt" placeholder="${CO_HOF}" value="${c.hofAt??''}"></label>

   <label>Closes (leave blank if never)<input type="date" data-f="close" value="${esc(c.close)}"></label>
   ${imgField('eco:'+esel,c.logo,'Company logo')}
   <label class="wide">Renames, one per line as date | short name | full name<textarea data-f="renames" rows="3">${esc((c.renames||[]).map(r=>`${r.date} | ${r.short} | ${r.name}`).join('\n'))}</textarea></label></div>`;
  const tForm=t=>`<div class="form">
   <label class="wide">Title name<input data-f="name" value="${esc(t.name)}"></label>
   <label>Company<select data-f="co">${ED.companies.map(c=>`<option ${t.co===c.short?'selected':''}>${esc(c.short)}</option>`).join('')}</select></label>

const edSave=()=>store.set('ro_ed',ED);
const edList=()=>ecat==='w'?ED.wrestlers:ecat==='c'?ED.companies:(ED.titles||=[]);
const blankT=()=>({name:'World Championship',co:ED.companies[0]?.short||'',tier:1,div:'singles',champ:'',since:'',past:''});
const edLabel=x=>ecat==='c'?x.short+' · '+x.name:ecat==='t'?(x.co?x.co+' · ':'')+x.name:x.name;
function edMsg(t,bad){const m=$('#emsg');if(m)m.innerHTML=`<div class="msg${bad?' bad':''}" style="margin:0 0 16px">${esc(t)}</div>`}
document.addEventListener('input',e=>{
  if(tab!=='editor')return;const t=e.target;
  if(t.id==='ename'){ED.name=t.value;edSave();return}
  if(t.id==='edesc'){ED.desc=t.value;edSave();return}
  if(t.id==='estart'){if(t.value){ED.start=t.value;edSave()}return}
  if(t.id==='eq'){rq=t.value;const p=t.selectionStart;vEditor();const j=$('#eq');j.focus();j.setSelectionRange(p,p);return}
  const f=t.dataset.f;if(!f)return;const items=edList(),x=items[esel];if(!x)return;
  if(f==='renames')x.renames=t.value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]).map(p=>({date:normDate(p[0]),short:p[1]||'',name:p[2]||p[1]||''})).filter(r=>r.date);
  else if(ecat!=='c'&&XSTATS.some(q=>q.k===f))x[f]=t.value===''?'':clamp(+t.value||1,1,100);
  else if(f==='pop'&&ecat!=='c')x.pop=clamp(Math.round(+t.value||0)/10,1,100);
  else if(['cha','wrk','pop'].includes(f))x[f]=clamp(+t.value||0,0,100);
  else if(f==='al'){x.al=clamp(+t.value,-100,100);x.align=alLetter(x.al);const l=document.querySelector('[data-alv]');if(l)l.textContent=alName(x.al)}
  else if(['wage','left','cash'].includes(f))x[f]=t.value===''?'':+t.value;
  else if(f==='wt')x.wt=clamp(+t.value||0,0,700);
  else if(f==='legend')x.legend=!!t.value;
  else if(f==='short'&&ecat==='c'){const old=x.short;x.short=t.value;ED.wrestlers.forEach(w=>{if(w.home===old)w.home=t.value});(ED.titles||[]).forEach(q=>{if(q.co===old)q.co=t.value})}
  else x[f]=t.value;
  edSave();
});
document.addEventListener('change',e=>{if(tab!=='editor'||e.target.id!=='eopen'||!e.target.value)return;const src=scenFrom(e.target.value);ED=clone(src);if(e.target.value!=='builtin'||true)ED.name=src.name.replace(/ \(my version\)$/,'')+' (my version)';esel=null;edSave();vEditor();edMsg(`Opened a fresh copy of "${src.name}". The original stays as it was. Save it to keep your version.`)});
document.addEventListener('input',e=>{if(tab!=='editor'||!['name','short'].includes(e.target.dataset.f))return;const items=edList(),x=items[esel];const b=document.querySelector(`[data-es="${esel}"] span`);if(x&&b)b.textContent=edLabel(x)});
document.addEventListener('click',e=>{
  if(tab!=='editor')return;const t=e.target.closest('button');if(!t||!$('#app').contains(t))return;const d=t.dataset;
  if(d.ec){ecat=d.ec;esel=null;rq='';vEditor()}
  else if(d.es!=null){esel=+d.es;vEditor()}
  else if(t.id==='elook'){const sel=edList()[esel];if(!sel)return;const tmp={id:'w'+esel,name:sel.name,gender:sel.gender,px:sel.px};dLook(tmp,()=>{if(tmp.px)sel.px=tmp.px;else delete sel.px;edSave();vEditor()},true)}
  else if(t.id==='eadd'){const L=edList();L.push(ecat==='w'?blankW():ecat==='c'?blankC():blankT());esel=L.length-1;rq='';edSave();vEditor()}
  else if(t.id==='edel'){const L=edList();L.splice(esel,1);esel=null;edSave();vEditor()}
  else if(t.id==='enew'){ED={name:'My scenario',start:'2000-01-01',companies:[],wrestlers:[]};esel=null;edSave();vEditor()}
  else if(t.id==='ebi'){ED=clone(BUILTIN);esel=null;edSave();vEditor();edMsg('Editor reset to the built-in scenario.')}
  else if(t.id==='esave'){const s=store.get('ro_scens')||{};s[ED.name]=clone(ED);store.set('ro_scens',s)?edMsg(`Saved "${ED.name}". It now appears in the New game list.`):edMsg('Could not save in this browser.',1)}
  else if(t.id==='eplay'){NG.src='editor';NG.start=ED.start;NG.choice=null;location.hash='new'}
  else if(t.id==='eimp')$('#file').click();
  else if(t.id==='ecw'||t.id==='ecc')copyTSV(t.id==='ecw');
  else if(t.id==='ect')copyTSV('t');
});
function copyTSV(wr){
  const clean=v=>String(v??'').replace(/[\t\n]/g,' ');
  const rows=wr==='t'?[['Title','Company','Tier','Division','Champion','Champion since','Past reigns'],...(ED.titles||[]).map(t=>[t.name,t.co,t.tier||1,t.div||'singles',t.champ||'',t.since||'',(t.past||'').split('\n').filter(Boolean).join('; ')])]
    :wr?[['Ring name','Gender','Birth date','Debut date','Retired by','Death date','Alignment (-100 face to 100 heel)','Gimmick','Weight (lbs)','Legend','Charisma','Workrate','Popularity','Company at start','Starting wage','Events left'],...ED.wrestlers.map(w=>[w.name,w.gender,w.birth,w.debut,w.retire,w.death||'',w.al??alDefault(w.align),w.gim,w.wt||'',w.legend?'Yes':'',w.cha,w.wrk,w.pop,w.home||'Indies',w.wage??'',w.left??''])]
    :[['Company','Short name','Owner','Size','Starting money','Opens','Closes','Renames','Popularity'],...ED.companies.map(c=>[c.name,c.short,c.owner||'',c.size||'Regional',c.cash??'',c.open,c.close,(c.renames||[]).map(r=>`${r.date}|${r.short}|${r.name}`).join('; '),c.pop])];
  const txt=rows.map(r=>r.map(clean).join('\t')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>edMsg(`Copied ${rows.length-1} ${wr==='t'?'titles':wr?'wrestlers':'companies'}. Paste into a spreadsheet; it splits into columns.`),()=>edMsg('Your browser blocked copying here.',1));
}

/* ----- import ----- */
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    let sheets=[];
    if(/\.(csv|tsv)$/i.test(f.name)){const txt=await f.text();sheets=[{name:f.name,rows:parseDelim(txt,/\.tsv$/i.test(f.name)?'\t':(txt.split('\n')[0].includes('\t')?'\t':','))}]}
    else{if(!window.XLSX)throw new Error('The spreadsheet reader did not load. Try a .csv file instead.');const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}))}
    const out=importSheets(sheets,f.name,ED);
    if(!out.wrestlers.length&&!out.companies.length)throw new Error('No wrestler or company columns found. Use headers like "Ring name" and "Company".');
    if(!out.companies.length&&ED)out.companies=ED.companies;
    ED=out;esel=null;edSave();vEditor();edMsg(`Imported ${out.wrestlers.length} wrestlers and ${out.companies.length} companies from ${f.name}. Start date: ${fmtDate(out.start)}. Stats missing from the sheet were kept from wrestlers already in the editor, or set to 50.`);
  }catch(err){edMsg(err.message||'Could not read that file.',1)}
};
function parseDelim(txt,sep){const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows}
function importSheets(sheets,fname,prev){
  let start='',wr=[],cs=[],ts=[];
  const findHdr=rows=>{for(let i=0;i<Math.min(rows.length,8);i++)if(rows[i].filter(v=>String(v).trim()).length>=2)return i;return -1};
  const colOf=(h,tests)=>h.findIndex(x=>tests.some(t=>typeof t==='string'?x===t:t.test(x)));
  for(const s of sheets){
    const hi=findHdr(s.rows);if(hi<0)continue;const h=s.rows[hi].map(v=>String(v).trim().toLowerCase());const body=s.rows.slice(hi+1).filter(r=>r.some(v=>String(v).trim()));
    const isW=colOf(h,['ring name','name','wrestler'])>=0&&colOf(h,[/birth/,/debut/,/^age/,/popularity/,/charisma/])>=0;
    const isC=colOf(h,['promotion','company','name'])>=0&&colOf(h,[/founded/,/open/])>=0&&!isW;
    h.forEach(x=>{const m=x.match(/^age on (.+)/);if(m&&!start)start=normDate(m[1])});
    const isT=colOf(h,['title','championship'])>=0&&colOf(h,[/champion$/,/holder/,/division/])>=0;
    if(isT){const c={name:colOf(h,['title','championship']),co:colOf(h,['company','promotion']),tier:colOf(h,[/tier/]),div:colOf(h,[/division/]),ch:colOf(h,[/^champion$/,/holder/]),since:colOf(h,[/since/,/won/]),past:colOf(h,[/past/,/history/])};
      for(const r of body){const name=String(r[c.name]).trim();if(!name)continue;ts.push({name,co:c.co>=0?String(r[c.co]).trim():'',tier:c.tier>=0&&[1,2,3].includes(+r[c.tier])?+r[c.tier]:1,div:/tag/i.test(String(r[c.div]||''))?'tag':'singles',champ:c.ch>=0?String(r[c.ch]).trim():'',since:c.since>=0?normDate(r[c.since]):'',past:c.past>=0?String(r[c.past]).split(';').map(x=>x.trim()).filter(Boolean).join('\n'):''})}continue}
    if(isC){const c={name:colOf(h,['promotion','company','name']),short:colOf(h,[/short/]),open:colOf(h,[/founded/,/open/]),close:colOf(h,[/clos/]),ren:colOf(h,[/^renames?$/]),pop:colOf(h,[/popularity/]),owner:colOf(h,[/owner/]),size:colOf(h,[/^size/]),cash:colOf(h,[/money/,/cash/])};
      for(const r of body){const name=String(r[c.name]).trim();if(!name||!normDate(r[c.open]))continue;let short=c.short>=0?String(r[c.short]).trim():'';short=(short||name).split(' / ')[0].trim();if(/^indies$/i.test(short))continue;
        let close='',renames=[];const ct=c.close>=0?String(r[c.close]):'';
        if(/^renamed/i.test(ct)){for(const m of ct.replace(/^renamed\s*/i,'').matchAll(/([A-Za-z][A-Za-z .()&-]*?)\s+(?:in\s+)?(\d{4})/g)){const nmx=m[1].trim(),p=nmx.match(/\(([^)]+)\)/);renames.push({date:m[2]+'-01-01',short:p?p[1]:nmx,name:nmx.replace(/\s*\([^)]*\)/,'')})}}
        else close=normDate(r[c.close]);
        if(c.ren>=0&&String(r[c.ren]).trim())renames=String(r[c.ren]).split(';').map(x=>x.split('|').map(y=>y.trim())).filter(p=>normDate(p[0])).map(p=>({date:normDate(p[0]),short:p[1]||'',name:p[2]||p[1]||''}));
        cs.push({short,name:name.replace(/\s*\(.*\)$/,''),owner:c.owner>=0?String(r[c.owner]).trim():'',size:c.size>=0&&SIZES[String(r[c.size]).trim()]?String(r[c.size]).trim():'Regional',cash:c.cash>=0&&r[c.cash]!==''&&!isNaN(+r[c.cash])?+r[c.cash]:'',open:normDate(r[c.open]),close,renames,pop:c.pop>=0&&r[c.pop]!==''?clamp(+r[c.pop]||40,1,100):40})}}
    if(isW){const c={name:colOf(h,['ring name','name','wrestler']),gender:colOf(h,['gender']),birth:colOf(h,[/birth date/,'birth','born']),age:colOf(h,[/^age on/,'age']),after:colOf(h,[/appears after/]),ageA:colOf(h,[/age when/]),dd:colOf(h,['debut date']),dy:colOf(h,['debut year','debut']),ret:colOf(h,[/leaves/,/retire/]),death:colOf(h,[/death/,/died/]),wage:colOf(h,[/starting wage/,/^wage/]),left:colOf(h,[/events left/,/contract left/]),home:colOf(h,[/home/,/company at start/,'company',/starts with/,'home company']),al:colOf(h,['alignment','side']),style:colOf(h,[/style/]),gim:colOf(h,['gimmick']),wt:colOf(h,[/weight/]),lg:colOf(h,[/legend/]),cha:colOf(h,[/charisma/]),wrk:colOf(h,[/workrate/,/work rate/]),pop:colOf(h,[/popularity/,'pop']),st:colOf(h,[/status/])};
      wr.push(...body.map(r=>({r,c})).filter(({r})=>String(r[c.name]).trim()));}
  }
  if(!start)start=sheets.some(s=>/1969/.test(s.name))||/1969/.test(fname)?'1969-01-01':(fname.match(/(19|20)\d\d/)?fname.match(/(19|20)\d\d/)[0]+'-01-01':'1969-01-01');
  const sy=+start.slice(0,4);
  const aliases={};cs.forEach(c=>{aliases[c.short.toLowerCase()]=c.short;c.renames.forEach(r=>aliases[r.short.toLowerCase()]=c.short)});
  const wrestlers=wr.map(({r,c})=>{const g=k=>c[k]>=0?r[c[k]]:'';const st=String(g('st')).toLowerCase();
    let birth=normDate(g('birth')),debut=normDate(g('dd'));const after=String(g('after'));let m=after.match(/(\d+)\s*years?,?\s*(\d+)?\s*months?/i);
    if(!debut&&m){const tot=sy*12+(+m[1])*12+(+(m[2]||0));debut=`${Math.floor(tot/12)}-${pad(tot%12+1)}-01`}
    if(!debut&&g('dy')!=='')debut=normDate(String(g('dy')));
    if(!birth&&g('ageA')!==''&&debut)birth=(+debut.slice(0,4)-(+g('ageA')))+'-07-01';
    if(!birth&&g('age')!==''&&+g('age'))birth=(sy-(+g('age'))-1)+'-07-01';
    const future=debut&&debut>start;
    let home=String(g('home')).replace(/\(.*\)/,'').trim();home=/^indies|^$/i.test(home)?'':(aliases[home.toLowerCase()]||home);
    const at=String(g('al')||g('style')).toLowerCase();const align=/tweener/.test(at)?'T':/heel/.test(at)?'H':'F';const alNum=at!==''&&!isNaN(+at)?clamp(+at,-100,100):alDefault(align);
    let retire=normDate(g('ret')),death=normDate(g('death'));if(!retire&&!death&&/retired/.test(st))retire=start;if(!death&&/deceased/.test(st))death=start;
    const num=(k,d)=>g(k)!==''&&!isNaN(+g(k))?clamp(+g(k),0,100):d;
    const gim=GIM.includes(String(g('gim')))?String(g('gim')):'None';
    return {name:String(g('name')).trim(),legend:/^(y|yes|true|1)$/i.test(String(g('lg')).trim()),wt:g('wt')!==''&&!isNaN(parseFloat(g('wt')))?Math.round(parseFloat(g('wt'))):0,gender:String(g('gender')).trim().toUpperCase().slice(0,1),birth,debut,retire,death,al:alNum,align:alLetter(alNum),wage:g('wage')!==''&&!isNaN(+g('wage'))?+g('wage'):'',left:g('left')!==''&&!isNaN(+g('left'))?+g('left'):'',gim,cha:num('cha',50),wrk:num('wrk',50),pop:num('pop',future?5:40),home}});
  const old={};(prev?.wrestlers||[]).forEach(w=>old[w.name.toLowerCase()]=w);const hasStat=wr.some(({c})=>c.cha>=0||c.wrk>=0||c.pop>=0);
  if(!hasStat)wrestlers.forEach(w=>{const o=old[w.name.toLowerCase()];if(o){w.cha=o.cha;w.wrk=o.wrk;w.pop=o.pop;if(!w.gim||w.gim==='None')w.gim=o.gim||'None';if(o.align)w.align=o.align;if(o.al!=null)w.al=o.al}});
  return {name:fname.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),desc:prev?.desc||'',start,companies:cs,wrestlers,titles:ts.length?ts:(prev?.titles||[])};
}

document.addEventListener('click',e=>{if(tab!=='companies')return;const b=e.target.closest('[data-cv]');if(!b)return;coSel=b.dataset.cv;location.hash='company'});
addEventListener('hashchange',()=>{applySub();render()});
const sv=store.get('ro_save');if(sv&&sv.v===1&&!sv.over)G=sv;
render();
}
</script>
